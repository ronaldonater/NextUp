<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffbadd"/>
      <stop offset="100%" stop-color="#df5c8b"/>
    </linearGradient>
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.65)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.0)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComponentTransfer in="blur" result="glow1"><feFuncA type="linear" slope="1.5"/></feComponentTransfer>
      <feMerge><feMergeNode in="glow1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circleClip"><circle cx="250" cy="250" r="240"/></clipPath>
  </defs>
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)"/>
  <ellipse cx="250" cy="110" rx="320" ry="180" fill="url(#glossGrad)" clip-path="url(#circleClip)"/>
  <text x="250" y="280" font-family="'Aller Light', 'Aller', sans-serif" font-weight="300" font-size="100" fill="#ffffff" text-anchor="middle" letter-spacing="1" transform="rotate(-6 250 250)" filter="url(#glow)">NextUp!</text>
</svg>
